<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy Tools Web</title>
  <link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar expanded">
      <div class="sidebar-head">
        <span class="brand">工具集合</span>
        <button id="toggleSidebar" class="icon-btn" title="收起导航">◀</button>
      </div>
      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-page="home" title="工作台">
          <span class="icon">H</span><span class="text">工作台</span>
        </button>
        <button class="nav-item" data-page="pdf" title="PDF 转长图">
          <span class="icon">P</span><span class="text">PDF 转长图</span>
        </button>
        <button class="nav-item disabled" title="图片工具（即将支持）" disabled>
          <span class="icon">I</span><span class="text">图片工具（即将支持）</span>
        </button>
      </nav>
    </aside>

    <main class="content">
      <section id="page-home" class="page active">
        <h1>Easy Tools</h1>
        <p>工具集合主页。点击下方卡片进入工具。</p>
        <div class="card">
          <h3>PDF 转长图</h3>
          <p>支持页码范围、预览自适应、导出长图。</p>
          <button id="enterPdf" class="primary">进入工具</button>
        </div>
      </section>

      <section id="page-pdf" class="page">
        <div class="page-title">
          <h1>PDF 转长图</h1>
          <p>左侧设置，右侧大预览。工具选择后导航自动收缩。</p>
        </div>

        <div class="tool-layout">
          <div class="panel controls">
            <div class="group">
              <h3>基础设置</h3>
              <label>PDF 文件</label>
              <input id="pdfFile" type="file" accept="application/pdf" />

              <label>导出格式</label>
              <select id="imageFormat">
                <option value="PNG">PNG</option>
                <option value="JPG">JPG</option>
              </select>
            </div>

            <div class="group collapsible">
              <button id="advToggle" class="adv-toggle">高级选项 ▸</button>
              <div id="advBody" class="adv-body collapsed">
                <label>页码范围</label>
                <input id="pageSpec" type="text" placeholder="留空=全部页，例如：9-11 或 1,3,9-11" />

                <label>DPI</label>
                <input id="dpi" type="number" min="72" max="600" value="150" />
              </div>
            </div>

            <div class="actions">
              <button id="convertBtn" class="primary" disabled>开始转换</button>
              <button id="downloadBtn" disabled>下载结果</button>
            </div>

            <div id="progressWrap" class="progress-wrap hidden">
              <div class="hint">正在导出，请稍候...</div>
              <div class="progress"><div id="progressBar"></div></div>
            </div>
          </div>

          <div class="panel preview">
            <div class="preview-toolbar">
              <button id="prevPage">上一页</button>
              <button id="nextPage">下一页</button>
              <span>页码</span>
              <input id="pageInput" type="number" min="1" value="1" />
              <span id="pageTotal">/ 0</span>
              <span class="spacer"></span>
              <span>显示</span>
              <select id="zoomMode">
                <option value="fit-width">适应宽度</option>
                <option value="fit-page">适应页面</option>
                <option value="75">75%</option>
                <option value="100">100%</option>
                <option value="125">125%</option>
                <option value="150">150%</option>
                <option value="200">200%</option>
              </select>
            </div>
            <div id="previewViewport" class="preview-viewport">
              <img id="previewImage" alt="PDF预览" />
              <div id="previewEmpty" class="preview-empty">请选择 PDF 以预览</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/web/app.js"></script>
</body>
</html>
